# podman registry configuration, v2 format. v1 and v2 keys cannot be mixed in
# one file.
unqualified-search-registries = ["docker.io"]

# Pulling docker.io from mainland China needs a mirror. These are declared as
# mirrors rather than as a location rewrite: podman tries each in order and
# falls back to docker.io itself when all are unreachable or lack the tag.
# Public China accelerators shut down and rate-limit routinely, which a
# location rewrite turns into a hard failure -- keep the fallback path.
#
# The order is fastest-first. Availability changes quickly; when pulls get
# slow, re-measure and reorder.
#
# location must be spelled out even though it is the identity: c/image refuses
# to load a [[registry]] block that has no location and whose prefix is not a
# wildcard, and it fails the whole file. A broken registries.conf makes every
# pull report a config error rather than a mirror error.
[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "docker.xuanyuan.me"

[[registry.mirror]]
location = "dockerproxy.net"

[[registry.mirror]]
location = "docker.m.daocloud.io"
