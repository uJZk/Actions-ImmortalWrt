# Router-class sysctl ceilings for a podman + qosify + daed build.
# These raise table sizes and buffer CEILINGS, not forced default allocations --
# they cost memory only when actually used. TCP congestion control is left
# unset: BBR is already the kernel default, asserted in this repo's kernel fragment
# (CONFIG_DEFAULT_BBR=y, with CUBIC off). net.core.default_qdisc is left unset for
# the same reason -- upstream's generic kernel config ships CONFIG_DEFAULT_FQ_CODEL=y.
#
# net.netfilter.nf_conntrack_max is deliberately absent. init_nf_conntrack() sizes
# the hash from RAM once at module load -- 262144 buckets above 4 GB -- and, because
# max_factor is 1, sets nf_conntrack_max to that same number. A sysctl override
# moves the ceiling without resizing the hash, and on this hardware any plausible
# value would *lower* the default rather than raise it. Neither OpenWrt nor
# ImmortalWrt sets it either; the surrounding conntrack timeouts come from
# upstream's own 11-nf-conntrack.conf, which this file must not fight.

# Deepen the pre-softirq RX backlog so a momentary processing lag under a
# WAN-rate burst on a 4-core Atom drops fewer packets instead of overflowing
# the default (1000-entry) queue.
net.core.netdev_max_backlog = 5000

# The matching half of that increase: NAPI stops after netdev_budget packets
# per softirq run, so a deeper queue on its own mostly converts drops into
# latency. Flow limit -- armed per-CPU by the RPS hotplug script -- is what then
# stops a single elephant flow from monopolising the deeper backlog.
net.core.netdev_budget = 600

# Widen the accept-queue backlog for LuCI, podman's API socket, and daed
# accepting near-simultaneous client connections. Table-size only, no
# buffer memory cost.
net.core.somaxconn = 4096

# Raise the per-socket buffer CEILING (not the default) so BBR can open a
# large-enough TCP window to fill a ~1 Gbps WAN link at realistic internet
# RTT. An application must opt in via setsockopt, so this costs nothing
# unless used.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 16384 4194304

# daed opens its own upstream connections, which share the ephemeral range with
# NAT masquerading; the 32768-60999 default leaves only ~28k ports for both.
net.ipv4.ip_local_port_range = 10240 65535

# podman burns an inotify instance per container and watches per image layer.
# The stock limits are sized for a router that never runs containers.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 131072

# The NIC RX path allocates with GFP_ATOMIC from softirq, which cannot reclaim,
# so an exhausted reserve surfaces as "page allocation failure" and dropped
# frames rather than as slowness. Sized against this build's 8 GB target.
vm.min_free_kbytes = 65536
