## This file contains files and directories that should
## be preserved during an upgrade.

# Per-container procd services generated by luci-app-podman, plus their enable
# symlinks. They live on the rootfs and no default keep list covers them:
# unlisted, containers stop autostarting after every sysupgrade and the LuCI
# status falls back to "missing".
/etc/init.d/container-*
/etc/rc.d/S*container-*
/etc/rc.d/K*container-*

# podman-stack container definitions -- what `update` rebuilds containers from.
# The directory ships with the image; the *.conf inside are site-written and
# would be lost on upgrade.
/etc/podman-stack.d/
