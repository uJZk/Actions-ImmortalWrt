name: Update Checker

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Forced Updating'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: 18 18 * * *

jobs:
  check:
    runs-on: ubuntu-slim

    steps:
    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" .
        echo "commitHash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@main
      with:
        path: .commitHash
        key: HEAD-${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true' || inputs.update
      uses: peter-evans/repository-dispatch@main
      with:
        token: ${{ secrets.GITHUB_TOKEN  }}
        event-type: Source Code Update
        # repository_dispatch leaves the inputs context empty, so anything not
        # named here falls back to the hardcoded default in the build's "Set
        # default inputs" step -- and release defaults to false. Without this
        # payload the nightly build only ever uploads an artifact, while the
        # cleanup step below keeps pruning releases nothing creates.
        client-payload: '{"release": "true"}'

    - name: Remove old Releases and workflow runs
      uses: ophub/delete-releases-workflows@main
      with:
        gh_token: ${{ secrets.GITHUB_TOKEN }}
        delete_releases: true
        releases_keep_latest: 3
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 3

